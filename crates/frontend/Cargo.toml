[package]
name = "pageshelf-frontend"
description = "A free and open source Pages server, written in Rust - Frontend components"
authors = ["V. D. <nyamrrp@proton.me>"]
version = "0.2.0"
license = "MIT License"
edition = "2024"
publish = false

[dependencies]
pageshelf-core = { path = "../core" }
minijinja = { version = "2.12", default-features = true, features = [
    "multi_template", "serde"
]}
url = { version = "2.5.7", features = ["serde"] }
tracing = { version = "0.1", features = [], default-features = false }
color-eyre = { version = "0.6", default-features = false }
config = "0.15"
mime_guess = "2"
clap = { version = "4.5.47", features = ["cargo", "std"], default-features = false}
serde = "1"
include_dir = "0.7.4"
metrics = "0.24"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
rstest = "0.26.1"