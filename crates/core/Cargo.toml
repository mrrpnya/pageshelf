# Library-only package
[package]
name = "pageshelf-core"
description = "A free and open source Pages server, written in Rust - Core components"
authors = ["V. D. <nyamrrp@proton.me>"]
version = "0.2.0"
license = "MIT License"
edition = "2024"
publish = false

[dependencies]
url = { version = "2.5.7" }
tracing = { version = "0.1", features = ["attributes"], default-features = false}
color-eyre = { version = "0.6", default-features = false }
tokio = { version = "1", features = ["full"]}
blake3 = "1.8.2"
lz4_flex = "0.11.5"
regex = "1.12"
futures = "0.3"

[dev-dependencies]
criterion = { version = "0.7", features = ["html_reports", "async_tokio"] }
rand = "0.9.2"
rstest = "0.26.1"
futures = "0.3"

[[bench]]
name = "memory"
harness = false