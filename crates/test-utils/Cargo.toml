[package]
name = "pageshelf-test-utils"
description = "A free and open source Pages server, written in Rust - Utilities for testing"
authors = ["V. D. <nyamrrp@proton.me>"]
version = "0.2.0"
license = "MIT License"
edition = "2024"
publish = false

[dependencies]
pageshelf-core = { path = "../core" }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["fmt", "time", "json"] }
testcontainers = "0.25"
base64 = "0.22"
forgejo-api = { version = "0.7"}
futures = "0.3"
reqwest = "0.12"
serde_json = "1"
url = { version = "2.5.7", features = ["serde"] }
tokio = { version = "1.47", features = ["macros"] }
color-eyre = "0.6"

[dev-dependencies]
rstest = "0.26"
