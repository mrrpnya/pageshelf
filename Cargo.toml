[package]
name = "pageshelf"
description = "A free and open source Pages server, written in Rust"
authors = ["V. D. <nyamrrp@proton.me>"]
version = "0.2.0"
license = "MIT License"
edition = "2024"
publish = false

[dependencies]
futures = "0.3"
forgejo-api = { version = "0.7", optional = true }
actix-web = { version = "4.11.0", default-features = false, features = [
    "macros",
    "compress-zstd",
    "compress-gzip",
] }
lz4 = "1.28.1"
time = { version = "0.3", features = ["local-offset"] }
clap = { version = "4.5.47", features = ["cargo", "derive", "unicode"] }
tracing-subscriber = { version = "0.3", features = ["fmt", "time", "json"] }
tracing = { version = "0.1", features = ["attributes"] }
color-eyre = "0.6"
url = { version = "2.5.7", features = ["serde"] }
minijinja = { version = "2.12", default-features = true, features = [
    "multi_template", "serde"
]}
miette = "7.6.0"
serde = "1"
config = "0.15"
mime_guess = "2"
redis = { version = "0.32", features = ["aio", "tokio-comp"], optional = true }
tokio = { version = "1", features = ["full"] }
anstyle = "1.0"

[dev-dependencies]
tokio = { version = "1.47", features = ["macros"] }
env_logger = "0.11"
criterion = { version = "0.7", features = ["html_reports", "async_std"] }
rand = "0.9"
testcontainers = "0.25"
reqwest = "0.12"
serde_json = "1"
base64 = "0.22"

[features]
default = ["redis", "forgejo"]
forgejo = ["dep:forgejo-api"]
gitea = []
gitlab = []
redis = ["dep:redis"]

[[bench]]
name = "web_access"
harness = false

[[bench]]
name = "memory"
harness = false

[profile.release]
opt-level = 3
overflow-checks = true
codegen-units = 1
debug = false
lto = true
strip = true
panic = 'abort'