[workspace]
resolver = "3"
members = [
    "crates/core", 
    "crates/frontend", 
    "crates/web", 
    "crates/test-utils",
    "crates/providers/upstream-forgejo", 
    "crates/providers/cache-redis"
]

[package]
name = "pageshelf"
description = "A free and open source Pages server, written in Rust"
authors = ["V. D. <nyamrrp@proton.me>"]
version = "0.2.0"
license = "MIT License"
edition = "2024"
keywords = ["pages", "forgejo"]
publish = false

[dependencies]
futures = "0.3"
time = { version = "0.3", features = ["local-offset"] }
clap = { version = "4.5.47", features = ["cargo", "derive", "unicode"] }
tracing-subscriber = { version = "0.3", features = ["fmt", "time", "json"] }
tracing = { version = "0.1", features = ["attributes"] }
color-eyre = "0.6"
url = { version = "2.5.7", features = ["serde"] }
config = "0.15"
tokio = { version = "1", features = ["full"] }
anstyle = "1.0"
pageshelf-core = { path = "crates/core" }
pageshelf-frontend = { path = "crates/frontend" }
pageshelf-web = { path = "crates/web" }
serde = "1"
serde_json = "1"
pageshelf-provider-upstream-forgejo = { path = "crates/providers/upstream-forgejo", optional = true}
pageshelf-provider-cache-redis = { path = "crates/providers/cache-redis", optional = true}
metrics-exporter-prometheus = "0.17"
metrics-process = "2.4"
#tikv-jemallocator = { version = "0.6" }

[dev-dependencies]
tokio = { version = "1.47", features = ["macros"] }
env_logger = "0.11"
rand = "0.9"
testcontainers = "0.25"
reqwest = "0.12"
serde_json = "1"

[features]
default = ["redis", "forgejo"]
forgejo = ["dep:pageshelf-provider-upstream-forgejo"]
gitea = []
gitlab = []
redis = ["dep:pageshelf-provider-cache-redis"]

[profile.release]
opt-level = 3
overflow-checks = true
codegen-units = 1
debug = false
lto = true
strip = true
panic = 'abort'
